<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon-keepxtra.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14532D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Paint a light canvas before the CSS bundle / React app loads. */
      html,
      body {
        margin: 0;
        background-color: #fafafa;
        color-scheme: light;
      }
    </style>
    <title>KeepXtra — Powering Africa's Fresh Produce Supply Chain</title>
    <meta
      name="description"
      content="KeepXtra is the technology-driven logistics infrastructure reducing post-harvest food loss across Africa — connecting farmers to storage, quality assurance, and delivery for restaurants, hotels, retailers, and households."
    />
    <!-- Static social defaults (per-page tags are injected at runtime by the Seo component) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KeepXtra" />
    <meta property="og:title" content="KeepXtra — Powering Africa's Fresh Produce Supply Chain" />
    <meta property="og:description" content="Technology-driven cold-chain infrastructure reducing post-harvest food loss across Africa — from farm to storage to doorstep." />
    <meta property="og:url" content="https://www.keepxtra.com/" />
    <meta property="og:image" content="https://www.keepxtra.com/favicon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KeepXtra — Powering Africa's Fresh Produce Supply Chain" />
    <meta name="twitter:description" content="Technology-driven cold-chain infrastructure reducing post-harvest food loss across Africa — from farm to storage to doorstep." />
    <meta name="twitter:image" content="https://www.keepxtra.com/favicon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KeepXtra",
        "url": "https://www.keepxtra.com",
        "logo": "https://www.keepxtra.com/favicon-512.png",
        "email": "info@keepxtra.com",
        "telephone": "+233591414352",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "256 Avenue, North Kaneshie Street",
          "addressCountry": "GH"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
