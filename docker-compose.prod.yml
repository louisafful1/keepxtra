# Production-oriented stack. Builds the real multi-stage image (no source
# bind-mount, no dev dependencies) and requires a real env file — nothing
# here has a baked-in secret.
#
# In most real deployments MongoDB and Redis are managed services (Atlas,
# Redis Cloud/Elasticache, etc.) rather than containers — point MONGODB_URI /
# REDIS_URL at those instead and omit the `mongo`/`redis` services below.
# They're included for a fully self-hosted deployment or a staging box.
#
#   cp backend/.env.production.example backend/.env.production   # fill in real values
#   docker compose -f docker-compose.prod.yml up --build -d
#
name: keepxtra-prod

services:
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:process.env.PORT||4000,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      # Matches scripts/backup.sh's default output dir — lets you also run
      # mongodump/mongorestore directly inside this container against
      # /backup if you'd rather not connect over the network.
      - ./backend/backups:/backup
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  redis_data:
