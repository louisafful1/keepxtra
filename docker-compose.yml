# Local development stack: backend (hot-reload via tsx watch) + MongoDB + Redis.
# Zero setup required — every value below is a non-secret local default, not a
# real credential. For production, see docker-compose.prod.yml instead.
#
#   docker compose up --build
#
name: keepxtra

services:
  backend:
    build:
      context: ./backend
      target: deps
    working_dir: /app
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/keepxtra
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0123456789ab
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-0123456789ab
      JWT_REFRESH_EXPIRES_IN: 30d
      COOKIE_SECRET: dev-only-cookie-secret-change-me-0123456
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:4000,path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  redis_data:
  backend_node_modules:
